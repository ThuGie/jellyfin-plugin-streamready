name: Build plugin

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj -c Release -o artifacts/build

      - name: Package zip
        id: pkg
        run: |
          python3 scripts/package_plugin.py \
            --dll artifacts/build/Jellyfin.Plugin.StreamReady.dll \
            --thumb Jellyfin.Plugin.StreamReady/thumb.png \
            --csproj Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj \
            --output-dir artifacts/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-streamready
          path: artifacts/pkg/*.zip

      - name: Verify tag matches assembly version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match AssemblyVersion $VERSION"
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="StreamReady ${VERSION}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/pkg/*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${TITLE}"
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/pkg/*.zip \
              --title "${TITLE}" \
              --generate-notes
          fi

      - name: Update catalog checksum
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
          ZIP_NAME: ${{ steps.pkg.outputs.zip_name }}
        run: |
          set -euo pipefail
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          CHANGELOG="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body // ""')"
          python3 scripts/update_manifest.py \
            --manifest manifest.json \
            --version "$VERSION" \
            --checksum "$CHECKSUM" \
            --source-url "$SOURCE_URL" \
            --changelog "${CHANGELOG:-See GitHub Releases.}"
          cp manifest.json /tmp/streamready-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/streamready-manifest.json manifest.json
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
          else
            git commit -m "chore: update catalog checksum for ${VERSION} [skip ci]"
            git push origin main
          fi
