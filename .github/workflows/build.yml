name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Publish
        run: dotnet publish Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj -c Release -o artifacts/build
      - name: Package zip
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, os, zipfile
          from datetime import datetime, timezone
          dll = "artifacts/build/Jellyfin.Plugin.StreamReady.dll"
          os.makedirs("artifacts/pkg", exist_ok=True)
          meta = {
            "guid": "9d2e8c4a-1f6b-4a73-b8e0-5c9f3a7d2e11",
            "name": "StreamReady",
            "description": "Pre-encode oversized or incompatible movies and episodes so clients can Direct Play.",
            "overview": "Pre-encode oversized or incompatible movies and episodes so clients can Direct Play.",
            "owner": "ThuGie",
            "category": "General",
            "version": "1.0.0.0",
            "changelog": "See GitHub Releases.",
            "targetAbi": "10.11.0.0",
            "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          zip_path = "artifacts/pkg/jellyfin-plugin-streamready_1.0.0.0.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write(dll, "Jellyfin.Plugin.StreamReady.dll")
              zf.writestr("meta.json", json.dumps(meta, indent=2))
          print(zip_path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-streamready
          path: artifacts/pkg/*.zip
      - name: Attach release zip
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/pkg/*.zip --clobber
