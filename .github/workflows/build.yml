name: Build plugin

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Regression checks
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = "Linux" ]; then args+=(--ffmpeg); fi
          dotnet run --project tests/StreamReady.Regression -c Release -- "${args[@]}"

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      checksum: ${{ steps.pkg.outputs.checksum }}
      zip_name: ${{ steps.pkg.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj -c Release -o artifacts/build

      - name: Package zip
        id: pkg
        run: |
          python3 scripts/package_plugin.py \
            --dll artifacts/build/Jellyfin.Plugin.StreamReady.dll \
            --thumb Jellyfin.Plugin.StreamReady/thumb.png \
            --csproj Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj \
            --output-dir artifacts/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-streamready
          path: artifacts/pkg/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: streamready-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin-streamready
          path: artifacts/pkg

      - name: Verify tag matches assembly version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          python3 -m zipfile -t artifacts/pkg/*.zip
          test "$(md5sum artifacts/pkg/*.zip | cut -d ' ' -f 1)" = "${{ needs.build.outputs.checksum }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match AssemblyVersion $VERSION"
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="StreamReady ${VERSION}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/pkg/*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${TITLE}"
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/pkg/*.zip \
              --title "${TITLE}" \
              --generate-notes
          fi

      - name: Update catalog checksum
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          set -euo pipefail
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          CHANGELOG="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body // ""')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --force -B main origin/main
          python3 scripts/update_manifest.py \
            --manifest manifest.json \
            --version "$VERSION" \
            --checksum "$CHECKSUM" \
            --source-url "$SOURCE_URL" \
            --changelog "${CHANGELOG:-See GitHub Releases.}"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
          else
            git commit -m "chore: update catalog checksum for ${VERSION} [skip ci]"
            git push origin main
          fi
