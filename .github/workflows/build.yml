name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj -c Release -o artifacts/build

      - name: Package zip
        id: pkg
        run: |
          python3 scripts/package_plugin.py \
            --dll artifacts/build/Jellyfin.Plugin.StreamReady.dll \
            --thumb Jellyfin.Plugin.StreamReady/thumb.png \
            --csproj Jellyfin.Plugin.StreamReady/Jellyfin.Plugin.StreamReady.csproj \
            --output-dir artifacts/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-streamready
          path: artifacts/pkg/*.zip

      - name: Attach release zip
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/pkg/*.zip --clobber

      - name: Update catalog checksum
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          CHECKSUM="${{ steps.pkg.outputs.checksum }}"
          ZIP_NAME="${{ steps.pkg.outputs.zip_name }}"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${ZIP_NAME}"
          python3 scripts/update_manifest.py \
            --manifest manifest.json \
            --version "$VERSION" \
            --checksum "$CHECKSUM" \
            --source-url "$SOURCE_URL" \
            --changelog "${RELEASE_BODY:-See GitHub Releases.}"
          cp manifest.json /tmp/streamready-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/streamready-manifest.json manifest.json
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
          else
            git commit -m "chore: update catalog checksum for ${VERSION} [skip ci]"
            git push origin main
          fi
