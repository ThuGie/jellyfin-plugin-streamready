changelog: >
  1.1.0: Load more + encode all matching; MKV/multi-audio/subs; failed-job ffmpeg logs;
  settle delay for new files; per-library encode presets; container/codec checkbox grids;
  keep allowed HDR (tone-map only disallowed ranges); pause kills ffmpeg and requeues;
  why-listed reason details; discard if output larger than source.
