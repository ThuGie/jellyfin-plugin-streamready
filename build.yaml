framework: "net9.0"
owner: "ThuGie"
overview: "Pre-encode oversized or incompatible movies and episodes so clients can Direct Play."
imageUrl: "https://raw.githubusercontent.com/ThuGie/jellyfin-plugin-streamready/main/images/logo.png"
description: >
  StreamReady scans your movie and TV libraries for files that Jellyfin would have to
  live-transcode (wrong container, video codec, HDR/Dolby Vision, audio codec, or size).
  In Manual mode you review a Needs Encoding list and encode one file or a selection.
  Auto Direct Pre-Transcode can queue matches automatically. Successful encodes replace
  the original according to your backup/replace/sidecar policy.
category: "General"
artifacts:
  - "Jellyfin.Plugin.StreamReady.dll"
changelog: >
  Compatibility: checkbox lists for all Jellyfin video ranges (incl. DOVIWithEL) and
  common audio codecs instead of comma-separated text fields.
